name: payments

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in .env (see .env.example)}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env (see .env.example)}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env (see .env.example)}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env (see .env.example)}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env (see .env.example)}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
      ACQUIRER_BASE_URL: http://acquirer-mock:8000
    volumes:
      - ./api:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  # Simulates the acquirer with the same image and code as the API. It has no database and is
  # not routed by the gateway: only the API reaches it, through the internal network (DA-03).
  acquirer-mock:
    build: ./api
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    # --no-reload passes the container environment to the server workers; otherwise
    # artisan serve drops every variable outside its passthrough list when api/.env exists.
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]
    # APP_KEY is set empty on purpose: the mock encrypts and signs nothing, so it must not hold the
    # key that signs the API's idempotency fingerprints, not even from api/.env (an existing
    # variable is never overwritten by the .env file). Debug pages stay off.
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: "false"
      APP_KEY: ""
      ACQUIRER_MOCK_ENABLED: "true"
      PHP_CLI_SERVER_WORKERS: 4
      CACHE_STORE: file
      SESSION_DRIVER: array
      LOG_CHANNEL: stderr
    volumes:
      - ./api:/var/www/html
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ./web
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules

  gateway:
    image: nginx:1.29-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  web-node-modules:
